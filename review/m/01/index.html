    if(!state.animationPlaying)return;
    const animation=parsed.animations[0],duration=Math.max(...animation.channels.map(c=>c.input[c.input.length-1]||0),0);
    const dt=animationLast?Math.min((now-animationLast)/1000,.1):0;animationLast=now;animationTime+=dt;
    for(const channel of animation.channels)sampleAnimation(channel,Math.min(animationTime,duration));root.updateMatrixWorld(true);render();
    if(animationTime>=duration){state.animationPlaying=false;animationTime=0;animationLast=0;$('animation-play').textContent=tr('animationPlay');updateDebug();return;}
    animationFrame=requestAnimationFrame(animateGLB);
  }
  function bindUI(){
    $('language').addEventListener('click',()=>{state.lang=state.lang==='zh'?'en':'zh';applyLanguage();});
    document.querySelectorAll('[data-station]').forEach(button=>button.addEventListener('click',()=>state.ready&&changeScope(button.dataset.station)));
    $('level').addEventListener('change',()=>{state.level=$('level').value;updateVisibility(false);});
    $('orbit-mode').addEventListener('click',()=>changeMode('orbit'));$('explode-mode').addEventListener('click',()=>changeMode('explode'));
    $('explode').addEventListener('input',()=>{stopAuto();setAmount(Number($('explode').value)/100);});$('assemble').addEventListener('click',()=>animateAmount(0));$('auto-explode').addEventListener('click',()=>animateAmount(1));
    $('reset').addEventListener('click',()=>fit());$('top').addEventListener('click',()=>fit(visible,true));$('mobile-toggle').addEventListener('click',()=>$('layout').classList.toggle('side-open'));
    $('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('status').textContent=state.lang==='zh'?'此瀏覽器不支援全螢幕，可使用瀏覽器全螢幕快捷鍵。':'Use the browser full-screen shortcut.';}});
    $('animation-play').addEventListener('click',()=>{if(!parsed.animations.length)return;state.animationPlaying=!state.animationPlaying;if(state.animationPlaying){stopAuto();setAmount(0);animationLast=0;animationFrame=requestAnimationFrame(animateGLB);}else{cancelAnimationFrame(animationFrame);animationLast=0;}$('animation-play').textContent=tr(state.animationPlaying?'animationPause':'animationPlay');updateDebug();});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){stopAuto();select(null);$('layout').classList.remove('side-open');}});
  }
  async function main(){
    try{
      buildCategoryUI();bindUI();progress(3,'preparing');await sleepFrame();initialiseScene();
      const buffer=await decodeEmbedded();progress(40,'parsing');await sleepFrame();parsed=await loadGLB(buffer);root=parsed.root;scene.add(root);
      progress(82,'arranging');await sleepFrame();prepareMetadata();buildOptionalUI();state.ready=true;updateLevelOptions();progress(90,'rendering');updateVisibility(true);
      if(parsed.animations.some(a=>a.channels.length)){$('animation').hidden=false;$('animation-name').textContent=parsed.animations[0].name;}
      $('model-id').textContent=(build.modelLabel||'Hutoupi')+' · '+(build.sha256||'').slice(0,12);
      progress(100,'ready');await sleepFrame();$('loading').hidden=true;updateDebug();
      if(state.warnings.length){$('error').hidden=false;$('error').innerHTML=`<b>${escapeHTML(tr('warnings'))}</b>${escapeHTML(state.warnings.join('\n'))}`;}
    }catch(error){showError(error);}
  }
  main();
})();
</script>
</body>
</html>
