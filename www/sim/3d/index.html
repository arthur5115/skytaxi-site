<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>虎頭埤纜車 全天候隨需發車 營運動態模擬（三維實景）</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1d2a33; --sub:#5d6b75; --line:#d9dee2;
  --A:#1f6fb2; --B:#d9822b; --water:#cfe3ef; --ground:#e7e1d3; --ok:#2f8f5b; --warn:#c0392b; --accent:#0f4c5c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px;line-height:1.5}
header{background:var(--accent);color:#fff;padding:16px 24px 14px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
header .tt{flex:1;min-width:280px}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.5px}
header h1 .od{background:#f2c14e;color:#3b2a00;padding:1px 10px;border-radius:4px;margin:0 6px}
header p{margin:4px 0 0;font-size:13px;opacity:.88}
.lang{background:transparent;border:1px solid rgba(255,255,255,.7);color:#fff;border-radius:16px;padding:5px 14px;cursor:pointer;font:inherit;font-size:13px}
.lang:hover{background:rgba(255,255,255,.15)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line)}
.bar label{color:var(--sub);font-size:13px;margin-right:4px}
.bar select,.bar button{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px 8px;color:var(--ink);cursor:pointer}
.bar button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar button.on{background:#e6f0f3;border-color:var(--accent)}
.bar input[type=range]{vertical-align:middle;width:120px}
.grp{display:flex;align-items:center;gap:4px}
.clock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;margin-left:auto}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;padding:14px 24px}
@media(max-width:1100px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 6px;font-weight:700;color:var(--accent);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-weight:400;color:var(--sub);font-size:12px}
canvas{display:block;width:100%}
#v3d{position:relative;height:clamp(360px,56vw,600px);border-radius:6px;overflow:hidden;background:#9cc3dc}
#v3d canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.camBar{position:absolute;left:10px;top:10px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 20px)}
.camBar button{font:inherit;font-size:12.5px;border:1px solid rgba(255,255,255,.7);background:rgba(15,40,60,.55);color:#fff;border-radius:16px;padding:3px 11px;cursor:pointer;backdrop-filter:blur(3px)}
.camBar button.on{background:#f2c14e;color:#3b2a00;border-color:#f2c14e}
.v3dMsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.lbl{font-family:"Noto Sans TC",sans-serif;font-size:12px;color:#fff;background:rgba(15,40,60,.62);padding:2px 7px;border-radius:10px;white-space:nowrap;pointer-events:none}
.lbl.st{font-size:13px;font-weight:700;background:rgba(15,76,92,.82)}
.lbl.A{background:rgba(31,111,178,.85)}.lbl.B{background:rgba(217,130,43,.88)}
.lbl.mt{background:rgba(110,110,120,.75)}
.mode{border-radius:6px;padding:8px 10px;font-weight:700;margin-bottom:8px}
.mode.day{background:#e8f3ec;color:#1f5f3b}
.mode.night{background:#e7eaf4;color:#2c3a6b}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:#f7f8f6;border-radius:6px;padding:6px 8px}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.kpi .full{grid-column:1/3}
.trains{width:100%;border-collapse:collapse;font-size:12.5px}
.trains td,.trains th{padding:3px 4px;border-bottom:1px solid #eef0f1;text-align:left;font-variant-numeric:tabular-nums}
.trains th{color:var(--sub);font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
.log{height:220px;overflow:auto;font-size:12px;font-variant-numeric:tabular-nums}
.log div{padding:2px 0;border-bottom:1px dashed #eef0f1}
.log .tm{color:var(--sub);margin-right:6px}
.log .mt{color:#2c3a6b;font-weight:500}
table.pt{width:100%;border-collapse:collapse;font-size:13px}
table.pt th,table.pt td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.pt th{background:#eef3f4;font-weight:500}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 24px 24px}
@media(max-width:1100px){.rules{grid-template-columns:1fr}}
.rules ol{margin:4px 0 0;padding-left:20px}
.rules li{margin:3px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:4px}
.src{font-size:12px;color:var(--sub);padding:0 24px 24px}
</style>
</head>

<header>
  <div class="tt">
    <h1 id="ttl"></h1>
    <p id="subt"></p>
  </div>
  <button class="lang" id="langBtn">English</button>
</header>

<div class="bar">
  <div class="grp"><label data-i="ctlPhase"></label>
    <select id="selPhase"><option value="2" data-i="phase2"></option><option value="1" data-i="phase1"></option></select></div>
  <div class="grp"><label data-i="ctlScen"></label>
    <select id="selScen"><option value="avg" data-i="scAvg"></option><option value="peak" data-i="scPeak"></option><option value="cap" data-i="scCap"></option></select></div>
  <div class="grp"><label data-i="ctlMult"></label><input type="range" id="rngMult" min="0.2" max="8" step="0.1" value="1"><b id="txtMult" style="min-width:42px">×1.0</b></div>
  <div class="grp"><label data-i="ctlSpeed"></label>
    <select id="selSpeed"><option>1</option><option>10</option><option selected>30</option><option>60</option><option>120</option><option>300</option></select><span>×</span></div>
  <div class="grp"><label data-i="ctlJump"></label>
    <button data-j="07:50">07:50</button><button data-j="12:00">12:00</button><button data-j="21:50">21:50</button><button data-j="02:50">02:50</button></div>
  <div class="grp"><button class="pri" id="btnRun"></button><button id="btnReset" data-i="reset"></button></div>
  <div class="clock" id="clock">08:00:00</div>
</div>

<div class="wrap">
  <main>
    <div class="card">
      <h2><span data-i="cv0"></span><small data-i="cv0s"></small></h2>
      <div id="v3d">
        <div class="camBar" id="camBar"></div>
        <div class="v3dMsg" id="v3dMsg">三維場景載入中… Loading 3D…</div>
      </div>
    </div>
    <div class="card">
      <h2><span data-i="cv1"></span><small data-i="cv1s"></small></h2>
      <canvas id="cvLine" height="430"></canvas>
      <div class="legend" id="lg1"></div>
    </div>
    <div class="card">
      <h2><span data-i="cv2"></span><small data-i="cv2s"></small></h2>
      <canvas id="cvTS" height="300"></canvas>
    </div>
    <div class="card">
      <h2><span data-i="cv3"></span><small data-i="cv3s"></small></h2>
      <canvas id="cvHr" height="190"></canvas>
    </div>
  </main>
  <aside>
    <div class="card">
      <div class="mode day" id="modeBox"></div>
      <div class="kpi">
        <div><b id="kWait">0</b><span data-i="kWait"></span></div>
        <div><b id="kMaxW">0 s</b><span data-i="kMaxW"></span></div>
        <div><b id="kAvgW">—</b><span data-i="kAvgW"></span></div>
        <div><b id="kCeil">342 s</b><span data-i="kCeil"></span></div>
        <div class="full"><b id="kRate">—</b><span data-i="kRate"></span></div>
        <div><b id="kFlowE">0</b><span data-i="kFlowE"></span></div>
        <div><b id="kFlowW">0</b><span data-i="kFlowW"></span></div>
        <div><b id="kCapE">0</b><span data-i="kCapE"></span></div>
        <div><b id="kCapW">0</b><span data-i="kCapW"></span></div>
        <div><b id="kTot">0</b><span data-i="kTot"></span></div>
        <div><b id="kCars">0</b><span data-i="kCars"></span></div>
      </div>
    </div>
    <div class="card">
      <h2 data-i="trTitle"></h2>
      <table class="trains"><thead><tr><th data-i="thTrain"></th><th data-i="thState"></th><th data-i="thCars"></th><th data-i="thPax"></th><th data-i="thSpd"></th></tr></thead><tbody id="trBody"></tbody></table>
    </div>
    <div class="card">
      <h2 data-i="logTitle"></h2>
      <div class="log" id="log"></div>
    </div>
  </aside>
</div>

<div class="rules">
  <div class="card">
    <h2 data-i="ruTitle"></h2>
    <ol id="rules"></ol>
  </div>
  <div class="card">
    <h2 data-i="ptTitle"></h2>
    <table class="pt" id="ptab"></table>
  </div>
</div>
<div class="src" id="src"></div>

   const s=1.0+Math.random()*1.1;m.compose(new THREE.Vector3(x,h+2*s,z),q,new THREE.Vector3(s,s,s));trunk.setMatrixAt(k,m);
   m.compose(new THREE.Vector3(x,h+4*s+3.2*s,z),q,new THREE.Vector3(3.4*s,3.8*s,3.4*s));crown.setMatrixAt(k,m);
   c.setHSL(0.24+Math.random()*0.08,0.42,0.22+Math.random()*0.12);crown.setColorAt(k,c);k++;}
 trunk.count=crown.count=k;scene.add(trunk);scene.add(crown);}

/* 車輛：Unicar-T 外形示意（4.70×1.65×2.44 m，車頂罩包覆弦線） */
const carMat={body:new THREE.MeshStandardMaterial({color:0xf6f7f8,roughness:.35,metalness:.1}),
  win:new THREE.MeshStandardMaterial({color:0x1d2c38,roughness:.05,metalness:.6,emissive:0xffd9a0,emissiveIntensity:0}),
  roof:new THREE.MeshStandardMaterial({color:0xd5dbe0,roughness:.4,metalness:.3}),
  stripeA:new THREE.MeshStandardMaterial({color:0x1f6fb2}),stripeB:new THREE.MeshStandardMaterial({color:0xd9822b}),
  door:new THREE.MeshStandardMaterial({color:0xe9edf0,roughness:.3})};
const gBody=new RoundedBoxGeometry(4.70,1.86,1.65,4,0.48),gWin=new RoundedBoxGeometry(4.2,0.8,1.67,2,0.2),gRoof=new RoundedBoxGeometry(3.4,0.62,1.1,3,0.25);
function makeCar(line){const outer=new THREE.Group(),inner=new THREE.Group();outer.add(inner);
  const b=new THREE.Mesh(gBody,carMat.body);b.position.y=-1.982+0.93;b.castShadow=true;inner.add(b);
  const w=new THREE.Mesh(gWin,carMat.win);w.position.y=-0.86;inner.add(w);
  const r=new THREE.Mesh(gRoof,carMat.roof);r.position.y=0.15;inner.add(r);
  const st=new THREE.Mesh(new THREE.BoxGeometry(4.3,0.14,1.67),line==='A'?carMat.stripeA:carMat.stripeB);st.position.y=-1.55;inner.add(st);
  const doors=[];for(const s of [1,-1]){const d=new THREE.Mesh(new THREE.BoxGeometry(0.95,1.55,0.05),carMat.door);d.position.set(0,-1.15,s*0.84);inner.add(d);doors.push(d);}
  outer.userData={inner,doors};outer.visible=false;scene.add(outer);return outer;}
const T3D=new Map();
function getT(tr){if(!T3D.has(tr.id)){const cars=[];for(let i=0;i<5;i++)cars.push(makeCar(tr.line));
  const div=document.createElement('div');div.className='lbl '+tr.line;const lab=new CSS2DObject(div);scene.add(lab);T3D.set(tr.id,{cars,lab,div,cc:null});}return T3D.get(tr.id);}
// 停靠位置對應（列車中心里程）：T1 前車位、T2／T3 停靠區、T4 前車位
const MAP=[[-1e4,-1e4-20],[0,-20],[796,775],[1095.2,1080],[1874.6,1894.6],[1e4,1e4+20]];
const disp=c=>{for(let i=0;i<MAP.length-1;i++)if(c<=MAP[i+1][0]){const [a,b]=MAP[i],[a2,b2]=MAP[i+1];return b+(b2-b)*(c-a)/(a2-a);}};
function centerCh(tr){
  if(tr.state==='idle'){const t=tr.term;const base=t===0?-20:(t===3?1894.6:1080);if(tr.berth==='inner'&&!(S.PH===1&&t===2))return base+(t===0?-32:32);return base;}
  return disp(tr.pos);}

/* 乘客（實例化） */
const PAXN=480,pax=new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.24,0.95,3,6),new THREE.MeshStandardMaterial({roughness:.8}),PAXN);
{const c=new THREE.Color();for(let i=0;i<PAXN;i++){c.setHSL(Math.random(),0.45,0.45+Math.random()*0.2);pax.setColorAt(i,c);}}
pax.castShadow=true;scene.add(pax);
const PLAT=[{c:-20,len:30},{c:775,len:30},{c:1080,len:30},{c:1894.6,len:30}];
function updatePax(){const Q=S.Q();const m=new THREE.Matrix4(),q=new THREE.Quaternion(),one=new THREE.Vector3(1,1,1);let k=0;
  for(let s=0;s<Q.length;s++){if(S.PH===1&&s===3)continue;const n=Q[s].e.length+Q[s].w.length;const sides=[Math.ceil(n/2),Math.floor(n/2)];
    for(const [si,cnt] of sides.entries()){const sg=si===0?1:-1;for(let j=0;j<Math.min(cnt,60)&&k<PAXN;j++){
      const u=PLAT[s].c-13+(j%13)*2.1+((j*7)%3)*0.3,row=Math.floor(j/13);const w=world(u,sg*(LANE+2.3+row*0.6+((j*13)%5)*0.08),-1.85+0.72);
      m.compose(w,q,one);pax.setMatrixAt(k++,m);}}}
  pax.count=k;pax.instanceMatrix.needsUpdate=true;}

/* 標籤 */
const stLab=[];[0,796,1095.2,1874.6].forEach((c,i)=>{const d=document.createElement('div');d.className='lbl st';const o=new CSS2DObject(d);o.position.copy(world(c+(i===0?-50:i===3?40:0),0,i===2?18:14));scene.add(o);stLab.push({o,d});});

/* 鏡頭 */
let mode='all',follow=null;const bar=document.getElementById('camBar');
const camDefs=()=>[['all',TXT('all')],['T1','T1'],['T2','T2'],['T3','T3'],['T4','T4'],['lake',TXT('lake')],['A1',TXT('fol')+' A1'],['B1',TXT('fol')+' B1']];
function drawBar(){bar.innerHTML='';for(const [k,l] of camDefs()){const b=document.createElement('button');b.textContent=l;if(k===mode)b.className='on';b.onclick=()=>setCam(k);bar.appendChild(b);}}
const tween={on:false};
function flyTo(pos,tgt){tween.on=true;tween.p0=camera.position.clone();tween.t0=controls.target.clone();tween.p1=pos;tween.t1=tgt;tween.s=performance.now();tween.k=0;}
function setCam(k){mode=k;drawBar();follow=null;
  const node={T1:-40,T2:777,T3:1085,T4:1905}[k];
  if(k==='all')flyTo(new THREE.Vector3(0,820,1380),new THREE.Vector3(0,40,-60));
  else if(k==='lake'){const a=world(300,-180,0),t=world(560,0,0);flyTo(new THREE.Vector3(a.x,40,a.z),new THREE.Vector3(t.x,58,t.z));}
  else if(node!==undefined){const c=world(node,0,0),n=NRM(Tan(node)),t=Tan(node);flyTo(new THREE.Vector3(c.x-n.x*95-t.x*70,c.y+38,c.z-n.y*95-t.y*70),new THREE.Vector3(c.x,c.y-4,c.z));}
  else follow=k;}
drawBar();

/* 日夜 */
let lastSunUpdate=-99;const sunVec=new THREE.Vector3(0,1,0);
function updateSun(){
  const h=((S.now%86400)+86400)%86400/3600;
  const el=Math.sin((h-6)/12*Math.PI)*62, az=180+(h-12)*15;
  const night=el<-2;
  if(Math.abs(el-lastSunUpdate)<0.6) return; lastSunUpdate=el;
  const phi=THREE.MathUtils.degToRad(90-Math.max(el,-8)),th=THREE.MathUtils.degToRad(az);
  const v=new THREE.Vector3().setFromSphericalCoords(1,phi,th);su.sunPosition.value.copy(v);domeU.sunDir.value.copy(v);
  sun.position.copy(controls.target).addScaledVector(v,1200);sun.intensity=night?0.45:Math.max(0.25,Math.min(2.4,el/18*2.4));
  if(night){sun.color.set(0x9fb4e0);v.set(-0.35,0.7,0.6).normalize();} else sun.color.setHSL(0.09,0.6,0.55+Math.min(0.35,el/90));
  hemi.intensity=night?0.75:0.35+Math.min(0.5,el/60);hemi.color.set(night?0x6f8cc4:0xdfefff);hemi.groundColor.set(night?0x1c2836:0x5a6b4a);
  sunVec.copy(v);stars.visible=night;domeU.night.value=night?1:0;
  if(night){domeU.zen.value.set(0x050c18);domeU.hor.value.set(0x1a2c46);}
  else if(el<10){domeU.zen.value.set(0x46679a);domeU.hor.value.set(0xf1c79a);}
  else {domeU.zen.value.set(0x3a79c0);domeU.hor.value.set(0xd6e7f3);}
  scene.fog.color.copy(domeU.hor.value);
  const e=night?1.6:(el<8?0.6:0);M.win.emissiveIntensity=e;carMat.win.emissiveIntensity=night?1.3:0;M.lamp.emissiveIntensity=night?2:0;
  renderer.toneMappingExposure=night?1.05:0.5;
  waterMat.color.set(night?0x1a3550:0x2c6878);
  if(!night){if(envRT)envRT.dispose();const sc=new THREE.Scene();const sk=new Sky();sk.scale.setScalar(10000);Object.assign(sk.material.uniforms.sunPosition.value,v);
    for(const k of ['turbidity','rayleigh','mieCoefficient','mieDirectionalG'])sk.material.uniforms[k].value=su[k].value;sc.add(sk);envRT=pmrem.fromScene(sc);scene.environment=envRT.texture;}
  else scene.environment=null;
}

/* 主迴圈 */
function resize(){const w=box.clientWidth,h=box.clientHeight;renderer.setSize(w,h,false);lr.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
let paxT=0,lang='';
function frame(){
  requestAnimationFrame(frame);
  if(tween.on){tween.k=Math.min(1,(performance.now()-tween.s)/1400);const e=tween.k<.5?2*tween.k*tween.k:1-Math.pow(-2*tween.k+2,2)/2;camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);if(tween.k>=1)tween.on=false;}
  const trains=S.trains();
  for(const tr of trains){const o=getT(tr);const n=tr.cars;const cc=centerCh(tr);const sg=tr.line==='A'?1:-1;
    const seg=tr.state==='trip'?tr.trip.segs[Math.min(tr.seg,tr.trip.segs.length-1)]:null;const dwell=tr.state==='idle'||(seg&&seg.type==='dwell');
    o.cars.forEach((car,i)=>{if(i>=n){car.visible=false;return;}car.visible=true;
      const ch=cc+(i-(n-1)/2)*5.68;const w=world(ch,sg*LANE,0);car.position.copy(w);
      const t=Tan(ch);car.rotation.set(0,Math.atan2(-t.y,t.x),0);car.userData.inner.rotation.z=Math.atan((strEl(ch+2)-strEl(ch-2))/4);
      const open=dwell&&!(!S.lineAvail(tr.line)&&tr.state==='idle');for(const d of car.userData.doors){d.position.x+=((open?0.95:0)-d.position.x)*0.08;}});
    o.lab.position.copy(world(cc,sg*LANE,3.2));
    const mt=!S.lineAvail(tr.line)&&tr.state==='idle';o.div.className='lbl '+(mt?'mt':tr.line);
    o.div.textContent=`${tr.id}｜${n} ${TXT('car')}｜${tr.pax.length}/${n*6}`+(mt?`｜${TXT('mt')}`:'');
    if(follow===tr.id){const w=world(cc,sg*LANE,0),t=Tan(cc),dir=tr.state==='trip'?tr.dir:(tr.term===0?1:-1);
      const nearSt=[-20,775,1080,1894.6].some(c=>Math.abs(cc-c)<90),bk=nearSt?70:42,up=nearSt?42:16,sd=nearSt?50:34;
      const want=new THREE.Vector3(w.x-t.x*dir*bk+NRM(t).x*sg*sd,w.y+up,w.z-t.y*dir*bk+NRM(t).y*sg*sd);
      camera.position.lerp(want,0.06);controls.target.lerp(w,0.12);}
  }
  paxT++;if(paxT%10===0)updatePax();
  if(S.lang!==lang){lang=S.lang;const nm=STN();stLab.forEach((s,i)=>s.d.textContent=nm[i]);drawBar();}
  stLab[3].o.visible=S.PH===2;
  updateSun();sun.target.position.copy(controls.target);sun.position.copy(controls.target).addScaledVector(sunVec,1200);
  const dist=camera.position.distanceTo(controls.target);const far=THREE.MathUtils.smoothstep(dist,180,420);
  for(const m of hiMats){m.resolution.set(box.clientWidth,box.clientHeight);m.opacity=0.95*far;}hiLines.forEach(l=>l.visible=far>0.02);
  beacons.forEach(b=>{b.visible=far>0.02;b.material.opacity=0.85*far;});
  controls.update();renderer.render(scene,camera);lr.render(scene,camera);
}
msg.textContent='';
frame();
window.__v3d={setCam,camera,controls,world,T3D,setFollow:(id)=>{follow=id;mode=id;}};

</script>
