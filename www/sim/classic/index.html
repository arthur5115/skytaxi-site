<title>虎頭埤纜車 全天候隨需發車 營運動態模擬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1d2a33; --sub:#5d6b75; --line:#d9dee2;
  --A:#1f6fb2; --B:#d9822b; --water:#cfe3ef; --ground:#e7e1d3; --ok:#2f8f5b; --warn:#c0392b; --accent:#0f4c5c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px;line-height:1.5}
header{background:var(--accent);color:#fff;padding:16px 24px 14px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
header .tt{flex:1;min-width:280px}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.5px}
header h1 .od{background:#f2c14e;color:#3b2a00;padding:1px 10px;border-radius:4px;margin:0 6px}
header p{margin:4px 0 0;font-size:13px;opacity:.88}
.lang{background:transparent;border:1px solid rgba(255,255,255,.7);color:#fff;border-radius:16px;padding:5px 14px;cursor:pointer;font:inherit;font-size:13px}
.lang:hover{background:rgba(255,255,255,.15)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line)}
.bar label{color:var(--sub);font-size:13px;margin-right:4px}
.bar select,.bar button{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px 8px;color:var(--ink);cursor:pointer}
.bar button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar button.on{background:#e6f0f3;border-color:var(--accent)}
.bar input[type=range]{vertical-align:middle;width:120px}
.grp{display:flex;align-items:center;gap:4px}
.clock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;margin-left:auto}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;padding:14px 24px}
@media(max-width:1100px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 6px;font-weight:700;color:var(--accent);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-weight:400;color:var(--sub);font-size:12px}
canvas{display:block;width:100%}
.mode{border-radius:6px;padding:8px 10px;font-weight:700;margin-bottom:8px}
.mode.day{background:#e8f3ec;color:#1f5f3b}
.mode.night{background:#e7eaf4;color:#2c3a6b}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:#f7f8f6;border-radius:6px;padding:6px 8px}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.kpi .full{grid-column:1/3}
.trains{width:100%;border-collapse:collapse;font-size:12.5px}
.trains td,.trains th{padding:3px 4px;border-bottom:1px solid #eef0f1;text-align:left;font-variant-numeric:tabular-nums}
.trains th{color:var(--sub);font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
.log{height:220px;overflow:auto;font-size:12px;font-variant-numeric:tabular-nums}
.log div{padding:2px 0;border-bottom:1px dashed #eef0f1}
.log .tm{color:var(--sub);margin-right:6px}
.log .mt{color:#2c3a6b;font-weight:500}
table.pt{width:100%;border-collapse:collapse;font-size:13px}
table.pt th,table.pt td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.pt th{background:#eef3f4;font-weight:500}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 24px 24px}
@media(max-width:1100px){.rules{grid-template-columns:1fr}}
.rules ol{margin:4px 0 0;padding-left:20px}
.rules li{margin:3px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:4px}
.src{font-size:12px;color:var(--sub);padding:0 24px 24px}
</style>

  { let prev=maintLine(now-WIN); for(let t=now-WIN+60;t<=now;t+=60){const m=maintLine(t); if(m!==prev){c.fillStyle='#2c3a6b';c.fillText(m?(LANG==='zh'?`${m} 線維修開始`:`Line ${m} maint. starts`):(LANG==='zh'?'維修結束':'maint. ends'),w-pr-110,Y(t)-3);c.strokeStyle='#2c3a6b';c.setLineDash([3,3]);c.beginPath();c.moveTo(pl,Y(t));c.lineTo(w-pr,Y(t));c.stroke();c.setLineDash([]);} prev=m; } }
  c.strokeStyle='#eef0f1';c.fillStyle='#8a949b';
  for(let m=0;m<=45;m+=5){const y=Y(now-m*60);c.beginPath();c.moveTo(pl,y);c.lineTo(w-pr,y);c.stroke();c.fillText(m===0?T('tsNow'):'-'+m+T('min'),4,y+4);}
  for(let i=0;i<=LAST;i++){const x=X(ST[i].ch);c.strokeStyle='#c9d3d8';c.beginPath();c.moveTo(x,pt);c.lineTo(x,h-pb);c.stroke();c.fillStyle='#1d2a33';c.fillText(ST[i].id,x-7,h-6);}
  // 上車事件（點色依候車時間）
  const ceil=curCeil();
  for(const b of stats.board){const y=Y(b.t);if(y>h-pb)continue;c.fillStyle=waitCol(b.w,ceil);c.globalAlpha=0.55;c.beginPath();c.arc(X(ST[b.s].ch)+(b.d>0?4:-4),y,1.8,0,6.28);c.fill();}
  c.globalAlpha=1;
  for(const tr of trains){
    if(tr.hist.length<2) continue;
    c.strokeStyle=COL[tr.line];c.lineWidth=tr.idx===1?2:1.4;c.setLineDash(tr.idx===2?[5,3]:[]);
    c.beginPath();let st=false;
    for(const [t,p] of tr.hist){const y=Y(t);if(y>h-pb)continue;const x=X(p);if(!st){c.moveTo(x,y);st=true;}else c.lineTo(x,y);}
    c.lineTo(X(berthPos(tr)),Y(now));c.stroke();c.setLineDash([]);
    c.fillStyle=COL[tr.line];c.beginPath();c.arc(X(berthPos(tr)),Y(now),3.5,0,6.28);c.fill();
  }
}
function drawHr(){
  const {c,w,h}=fit(document.getElementById('cvHr'));
  c.clearRect(0,0,w,h);c.font='11px "Noto Sans TC",sans-serif';
  const pl=46,pr=46,pt=18,pb=22,bw=(w-pl-pr)/24;
  const mx=Math.max(20,...stats.hrCalls)*1.15, wm=Math.max(CEIL[PH].one,...stats.hrBoard.map((b,i)=>b?stats.hrWaitSum[i]/b:0))*1.1;
  c.fillStyle='rgba(30,40,80,.06)';
  for(let i=0;i<24;i++){if(i>=22||i<8)c.fillRect(pl+i*bw,pt,bw,h-pt-pb);}
  c.strokeStyle='#eef0f1';
  for(let k=0;k<=4;k++){const y=pt+(h-pt-pb)*k/4;c.beginPath();c.moveTo(pl,y);c.lineTo(w-pr,y);c.stroke();
    c.fillStyle='#8a949b';c.fillText(Math.round(mx*(1-k/4)),4,y+4);c.fillText(Math.round(wm*(1-k/4))+'s',w-pr+6,y+4);}
  const curH=Math.floor(hourOf(now));
  for(let i=0;i<24;i++){const v=stats.hrCalls[i],bh=(h-pt-pb)*v/mx;c.fillStyle=i===curH?'#0f4c5c':'#8fb3be';rrect(c,pl+i*bw+2,h-pb-bh,bw-4,Math.max(bh,0.1),Math.min(3,bh/2));c.fill();
    if(i%2===0){c.fillStyle='#5d6b75';c.fillText(String(i).padStart(2,'0'),pl+i*bw+bw/2-6,h-6);}}
  // 候車上限（日間兩線／夜間一線）
  c.strokeStyle='#c0392b';c.setLineDash([4,3]);c.lineWidth=1.2;c.beginPath();
  for(let i=0;i<=24;i++){const cl=(i>=22||i<8)?CEIL[PH].one:CEIL[PH].two,y=h-pb-(h-pt-pb)*cl/wm,x=pl+i*bw;i===0?c.moveTo(x,y):c.lineTo(x,y);if(i<24){const n=((i+1)>=22||(i+1)<8)?CEIL[PH].one:CEIL[PH].two;c.lineTo(x+bw,y);}}
  c.stroke();c.setLineDash([]);
  c.strokeStyle='#d9822b';c.lineWidth=2;c.beginPath();let st=false;const pts=[];
  for(let i=0;i<24;i++){if(!stats.hrBoard[i])continue;const v=stats.hrWaitSum[i]/stats.hrBoard[i];const x=pl+i*bw+bw/2,y=h-pb-(h-pt-pb)*v/wm;pts.push([x,y]);if(!st){c.moveTo(x,y);st=true;}else c.lineTo(x,y);}
  c.stroke();c.fillStyle='#d9822b';for(const [x,y] of pts){c.beginPath();c.arc(x,y,2.5,0,6.28);c.fill();}c.lineWidth=1;
  c.fillStyle='#8fb3be';c.fillRect(pl,3,10,10);c.fillStyle='#5d6b75';c.fillText(T('hrCalls'),pl+14,12);
  c.fillStyle='#d9822b';c.fillRect(pl+110,7,14,3);c.fillStyle='#5d6b75';c.fillText(T('hrWait'),pl+128,12);
  c.strokeStyle='#c0392b';c.setLineDash([4,3]);c.beginPath();c.moveTo(pl+240,8.5);c.lineTo(pl+256,8.5);c.stroke();c.setLineDash([]);c.fillText(LANG==='zh'?'隨需候車上限':'Wait ceiling',pl+260,12);
}
/* ================= 介面 ================= */
const fmtT=t=>{const s=Math.floor(((t%86400)+86400)%86400);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':');};
const $=id=>document.getElementById(id);
function updateUI(){
  $('clock').textContent=fmtT(now);
  const mb=$('modeBox'),m=maintLine();
  mb.className='mode '+(m?'night':'day'); mb.textContent=m?(m==='A'?T('nightA'):T('nightB')):(PH===2?T('dayMode'):T('dayMode1'));
  let nw=0,mw=0;for(const q of Q)for(const a of [q.e,q.w]){nw+=a.length;if(a.length)mw=Math.max(mw,now-a[0].t0);}
  $('kWait').textContent=nw;$('kMaxW').textContent=Math.round(mw)+' s';
  $('kMaxW').style.color=mw>curCeil()?'#c0392b':'';
  const b=stats.board;$('kAvgW').textContent=b.length?Math.round(b.reduce((a,x)=>a+x.w,0)/b.length)+' s':'—';
  $('kCeil').textContent=(isNight()?CEIL[PH].one:CEIL[PH].two).toFixed(PH===2?0:1)+' s';
  const rate=stats.tot?stats.ok/stats.tot*100:null;
  $('kRate').textContent=rate===null?'—':rate.toFixed(1)+' %';$('kRate').style.color=rate===null?'':rate>=98?'#2f8f5b':rate>=97?'#c08a00':'#c0392b';
  $('kFlowE').textContent=b.filter(x=>x.d>0).length;$('kFlowW').textContent=b.filter(x=>x.d<0).length;
  $('kCapE').textContent=stats.seat.filter(x=>x.d>0).reduce((a,x)=>a+x.n,0);$('kCapW').textContent=stats.seat.filter(x=>x.d<0).reduce((a,x)=>a+x.n,0);
  $('kTot').textContent=stats.tot.toLocaleString();
  $('kCars').textContent=trains.filter(t=>t.state==='trip').reduce((a,t)=>a+t.cars,0);
  let rows='';
  for(const tr of trains){
    let st;
    if(!lineAvail(tr.line)&&tr.state==='idle') st=T('stMaint');
    else if(tr.state==='idle') st=(!allow2(tr.line)&&lines[tr.line].active!==tr)?T('stPark'):T('stIdle');
    else {const g=tr.trip.segs[Math.min(tr.seg,tr.trip.segs.length-1)];st=g.type==='dwell'?T('stDwell'):T('stRun')+(tr.dir>0?' →':' ←');}
    const where=tr.state==='idle'?' '+T('at')+' '+ST[tr.term].id:'';
    rows+=`<tr><td><span class="dot" style="background:${COL[tr.line]}"></span>${tr.id}</td><td>${st}${where}</td><td>${tr.cars}</td><td>${tr.pax.length}/${cap(tr)}</td><td>${(tr.v*3.6).toFixed(0)} km/h</td></tr>`;
  }
  $('trBody').innerHTML=rows;
  $('log').innerHTML=events.slice(0,40).map(e=>`<div><span class="tm">${fmtT(e.t)}</span><span class="${e.k==='evMs'||e.k==='evMe'?'mt':''}">${evText(e)}</span></div>`).join('');
  $('btnRun').textContent=running?T('run'):T('pause');
}
function evText(e){const p={...e.p};if(p.dir)p.dir=T(p.dir);return T(e.k)(p);}
function renderStatic(){
  document.documentElement.lang=LANG==='zh'?'zh-Hant':'en';
  $('ttl').innerHTML=T('ttl');$('subt').textContent=T('subt');
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=T(el.dataset.i);});
  $('langBtn').textContent=LANG==='zh'?'English':'中文';
  $('rules').innerHTML=T('rules').map(r=>`<li>${r}</li>`).join('');
  const H=T('ptHead');$('ptab').innerHTML=`<tr>${H.map(x=>`<th>${x}</th>`).join('')}</tr>`+T('ptRows').map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('');
  $('src').textContent=T('src');
  $('lg1').innerHTML=`<span><span class="dot" style="background:${COL.A}"></span>${T('lgA')}</span><span><span class="dot" style="background:${COL.B}"></span>${T('lgB')}</span><span><span class="dot" style="background:#cfe3ef"></span>${T('lgW')}</span><span>${T('lgQ')}</span>`;
  document.title=LANG==='zh'?'虎頭埤纜車 全天候隨需發車 營運動態模擬':'Hutoupi Cable Car — On-Demand Dispatch Simulation';
  updateUI();
}
$('langBtn').onclick=()=>{LANG=LANG==='zh'?'en':'zh';renderStatic();};
$('btnRun').onclick=()=>{running=!running;updateUI();};
$('btnReset').onclick=()=>reset(8*3600);
$('selPhase').onchange=e=>{PH=+e.target.value;reset(now-now%60);};
$('selSpeed').onchange=e=>{SPEED=+e.target.value;};
function setMult(v){MULT=v;$('rngMult').value=v;$('txtMult').textContent='×'+(+v).toFixed(1);}
$('rngMult').oninput=e=>setMult(+e.target.value);
$('selScen').onchange=e=>{SCEN=e.target.value;setMult(SCEN==='avg'?1:SCEN==='peak'?2.5:6);};
document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{const [hh,mm]=b.dataset.j.split(':').map(Number);reset(hh*3600+mm*60);});
reset(8*3600);
requestAnimationFrame(frame);
// 供檢核
window.__sim={get now(){return now},lines:()=>lines,cd:(t)=>canDepart(t),un:()=>freeAhead(1).concat(freeAhead(-1)),trains:()=>trains,stats:()=>stats,TRIP:()=>TRIP,LEGS,step:(s)=>{while(s>0){const dt=Math.min(0.5,s);simStep(dt);s-=dt;}},setScen:(s,m)=>{SCEN=s;$('selScen').value=s;setMult(m);},setPhase:(p,t)=>{PH=p;$('selPhase').value=p;reset(t);},reset};
</script>
