<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>虎頭埤纜車</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: 一條纜車線貫穿全站——首頁捲動即搭乘，四時光線決定主視覺；其餘頁面以大圖與短句帶出「下車之後」 */
:root{
  --paper:#f4f5f2; --card:#ffffff; --ink:#0f1d24; --muted:#58686d; --line:#dbe1de; --soft:#e9ece8;
  --lake:#21637a; --gold:#c08a2c; --forest:#3c6a4b; --brick:#9f4d33; --night:#0b161c;
  --t1:#9f4d33; --t2:#21637a; --t3:#9a7431; --t4:#3c6a4b;
  --accent:var(--lake);
  --f-disp:"Barlow Condensed","Noto Sans TC","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans TC","Noto Sans JP","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d171c; --card:#132128; --ink:#e6edef; --muted:#9fb0b4; --line:#26363d; --soft:#18272e;
  --lake:#6cb6cc; --gold:#e3b25a; --forest:#86bf96; --brick:#e28d6c; --night:#060d11;
  --t1:#e28d6c; --t2:#6cb6cc; --t3:#dcb46a; --t4:#86bf96; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0d171c; --card:#132128; --ink:#e6edef; --muted:#9fb0b4; --line:#26363d; --soft:#18272e;
  --lake:#6cb6cc; --gold:#e3b25a; --forest:#86bf96; --brick:#e28d6c; --night:#060d11;
  --t1:#e28d6c; --t2:#6cb6cc; --t3:#dcb46a; --t4:#86bf96; color-scheme:dark}
html[lang="ja"]{--f-body:"Noto Sans JP","Noto Sans TC",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75}
h1,h2,h3,h4{margin:0;line-height:1.22;text-wrap:balance}
p{margin:0}
a{color:inherit}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.kicker{font-family:var(--f-disp);font-weight:600;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}

/* nav */
.nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap}
.brand svg{flex:none}
.brand b{font-weight:900;font-size:19px;letter-spacing:.08em}
.links{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{text-decoration:none;font-size:14px;padding:7px 11px;border-radius:999px;white-space:nowrap;color:var(--muted)}
.links a:hover{color:var(--ink);background:var(--soft)}
.links a[aria-current="page"]{color:var(--ink);font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{background:none;border:0;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#1a1205;text-decoration:none;font-weight:700;border-radius:999px;padding:9px 18px;border:0;cursor:pointer;white-space:nowrap}
.cta.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8)}
.cta.ink{background:var(--ink);color:var(--paper)}
.nav .cta{padding:7px 15px;font-size:14px}

/* hero */
.hero{position:relative;background:var(--night);color:#fff;overflow:hidden}
.hero .bg{width:100%;height:clamp(460px,72vh,760px);object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,13,17,.15) 0%,rgba(6,13,17,0) 30%,rgba(6,13,17,.72) 100%)}
.hero .cap{position:absolute;inset:auto 0 0 0;z-index:2;padding-block:40px}
.hero h1{font-weight:900;font-size:clamp(52px,9.5vw,128px);letter-spacing:.08em;line-height:1.02}
.hero .sub{font-size:clamp(17px,2vw,22px);margin-top:14px;color:#eef3f3;max-width:30em}
.hero .line{font-family:var(--f-disp);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:14px;color:#d8e6e8;margin-bottom:14px}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.times{position:absolute;z-index:3;top:20px;right:20px;display:flex;gap:4px;background:rgba(6,13,17,.45);backdrop-filter:blur(8px);border-radius:999px;padding:4px}
.times button{border:0;background:none;color:#dfe9ea;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
.times button[aria-pressed="true"]{background:#fff;color:#0f1d24;font-weight:700}
.page-hero .bg{height:clamp(320px,52vh,560px)}
img[src$="aerial.jpg"]{object-position:50% 82%}
.page-hero h1{font-size:clamp(40px,7vw,88px)}
.crumb{font-size:13px;color:#d4e0e2;margin-bottom:8px}
.crumb a{color:#fff}

section{padding-block:64px}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 28px;margin-bottom:28px}
.sec-h h2{font-size:clamp(28px,3.8vw,46px);font-weight:900;margin-top:6px}
.sec-h p{color:var(--muted);max-width:40em;margin-top:10px;font-size:17px}
.more{font-size:15px;text-decoration:none;border-bottom:1.5px solid currentColor;color:var(--accent);white-space:nowrap}

/* facts strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-block:1px solid var(--line)}
.strip div{background:var(--paper);padding:22px 20px}
.strip b{display:block;font-family:var(--f-disp);font-weight:700;font-size:clamp(34px,4vw,50px);line-height:1}
.strip b small{font-family:var(--f-body);font-size:.36em;font-weight:500;margin-left:5px;color:var(--muted)}
.strip span{font-size:14px;color:var(--muted)}

/* journey */
.journey{background:var(--night);color:#e8eff0;padding:0}
.jhead{padding-block:64px 24px}
.jhead h2{font-size:clamp(28px,3.8vw,46px);font-weight:900;color:#fff;margin-top:6px}
.jhead p{color:#a9bcbf;max-width:40em;margin-top:10px;font-size:17px}
.jwrap{position:relative}
.jsticky{position:sticky;top:62px;height:calc(100vh - 62px);display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
.jimgs{position:relative}
.jimgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s}
.jimgs img.on{opacity:1}
.jimgs::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,13,17,.78) 0%,rgba(6,13,17,.2) 55%,rgba(6,13,17,0) 100%)}
.jtext{position:absolute;z-index:2;left:0;right:0;top:50%;transform:translateY(-50%)}
.jtext .k{font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.2em;color:var(--gold)}
.jtext h3{font-size:clamp(34px,5vw,64px);font-weight:900;color:#fff;margin-top:6px}
.jtext p{max-width:26em;color:#e3ecec;font-size:18px;margin-top:12px}
.jtext .stop{display:inline-flex;gap:8px;align-items:center;margin-top:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 16px;font-size:14px;color:#fff;text-decoration:none}
.jbar{background:#0b161c;border-top:1px solid #1f3038;padding:16px 0 18px}
.route{position:relative;height:56px}
.route svg{width:100%;height:56px;display:block}
.route text{font-family:var(--f-body);font-size:12px;fill:#a9bcbf}
.route .st text{fill:#fff;font-weight:700;font-size:13px}
.jsteps{position:relative;margin-top:calc(-100vh + 62px);pointer-events:none}
.jsteps .s{height:100vh}
.jfoot{display:flex;justify-content:space-between;font-size:13px;color:#8fa4a8;margin-top:4px}

/* station cards */
.stations{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.scard{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:440px;border-radius:14px;overflow:hidden;color:#fff;text-decoration:none;background:var(--night)}
.scard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,13,17,0) 35%,rgba(6,13,17,.85) 100%)}
.scard .b{position:relative;z-index:1;padding:20px}
.scard .c{font-family:var(--f-disp);font-weight:700;letter-spacing:.18em;font-size:14px;color:#fff;opacity:.85}
.scard h3{font-size:28px;font-weight:900;margin-top:2px}
.scard p{font-size:15px;color:#e5eded;margin-top:6px}
.scard ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.scard li{font-size:12px;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:2px 10px}
.scard .bar{position:absolute;left:0;right:0;top:0;height:5px;background:var(--sc);z-index:1}
@media (prefers-reduced-motion:no-preference){.scard img{transition:transform .6s}.scard:hover img{transform:scale(1.04)}}

/* split blocks */
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:44px;align-items:center}
.split.rev>.media{order:2}
.media img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;cursor:zoom-in}
.prose{display:grid;gap:14px;max-width:34em}
.prose h2{font-size:clamp(28px,3.4vw,42px);font-weight:900}
.prose .lead{font-size:18px}
.prose p{color:var(--muted)}
.ticks{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:10px}
.ticks li{padding-left:24px;position:relative}
.ticks li::before{content:"";position:absolute;left:3px;top:10px;width:11px;height:6px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}

/* 24h band */
.allday{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.slot{position:relative;border-radius:14px;overflow:hidden;min-height:300px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,13,17,0) 30%,rgba(6,13,17,.82) 100%)}
.slot>*:not(img){position:relative;z-index:1}
.slot em{font-style:normal;font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;font-size:14px;color:var(--gold)}
.slot b{font-size:22px;font-weight:900}
.slot span{font-size:14px;color:#e1eaea}

/* gallery / tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tile img{width:100%;aspect-ratio:3/2;object-fit:cover;cursor:zoom-in}
.tile .b{padding:16px 18px 18px;display:grid;gap:6px}
.tile h3{font-size:20px;font-weight:900}
.tile p{font-size:15px;color:var(--muted)}
.tile .tag{font-family:var(--f-disp);font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--sc,var(--accent))}

/* tickets */
.tickets{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.ttable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ttable th,.ttable td{padding:13px 16px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;vertical-align:top}
.ttable thead th{font-size:13px;color:var(--muted);font-weight:500;background:var(--soft)}
.ttable td.p{font-family:var(--f-disp);font-weight:700;font-size:22px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ttable td small{display:block;color:var(--muted);font-size:13px}
.ttable tr:last-child>*{border-bottom:0}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.calc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px;position:sticky;top:80px}
.calc h3{font-size:22px;font-weight:900}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.row label{font-size:15px}
.row label small{display:block;color:var(--muted);font-size:12px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.step button{width:34px;height:34px;border:0;background:none;cursor:pointer;font-size:18px}
.step output{min-width:28px;text-align:center;font-family:var(--f-disp);font-weight:700;font-size:18px}
select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:18px;height:18px;accent-color:var(--lake)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:14px}
.total b{font-family:var(--f-disp);font-weight:700;font-size:40px;line-height:1}
.copied{font-size:13px;color:var(--forest);min-height:1.2em}

/* planner */
.planner{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:28px;align-items:start}
.qs{display:grid;gap:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.q b{display:block;font-size:16px;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 15px;font-size:14px;cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.card-out{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-out .top{position:relative;height:180px}
.card-out .top img{width:100%;height:100%;object-fit:cover}
.card-out .top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,13,17,0),rgba(6,13,17,.7))}
.card-out .top h3{position:absolute;z-index:1;left:20px;bottom:16px;right:20px;color:#fff;font-size:26px;font-weight:900}
.tl{list-style:none;margin:0;padding:20px 22px 6px;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:62px 16px minmax(0,1fr);gap:12px}
.tl .t{font-family:var(--f-disp);font-weight:700;font-size:17px;text-align:right;padding-top:1px}
.tl .ln{position:relative}
.tl .ln::before{content:"";position:absolute;left:7px;top:0;bottom:0;border-left:2px solid var(--line)}
.tl li:last-child .ln::before{bottom:auto;height:12px}
.tl .ln::after{content:"";position:absolute;left:1px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--c,var(--accent));border:3px solid var(--card)}
.tl .x{padding-bottom:18px}
.tl .x b{display:block}
.tl .x span{font-size:14px;color:var(--muted)}
.tl .x em{font-style:normal;font-size:12px;font-weight:700;color:var(--c);margin-right:6px}
.outfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px 20px;border-top:1px solid var(--line)}
.outfoot .sum b{font-family:var(--f-disp);font-weight:700;font-size:28px}
.outfoot .sum span{display:block;font-size:13px;color:var(--muted)}

/* hotels compare */
.hotels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.hotel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;border-top:5px solid var(--sc)}
.hotel img{width:100%;aspect-ratio:16/9;object-fit:cover;cursor:zoom-in}
.hotel .b{padding:20px 22px 22px;display:grid;gap:12px}
.hotel h3{font-size:26px;font-weight:900}
.hotel dl{display:grid;grid-template-columns:96px minmax(0,1fr);margin:0;border-top:1px solid var(--line)}
.hotel dt,.hotel dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.hotel dt{color:var(--muted)}
.price{display:flex;gap:22px;flex-wrap:wrap}
.price div span{display:block;font-size:13px;color:var(--muted)}
.price div b{font-family:var(--f-disp);font-weight:700;font-size:30px}
.price div b small{font-family:var(--f-body);font-size:.45em;font-weight:500;color:var(--muted);margin-left:3px}

/* info grid */
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ibox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;border-top:4px solid var(--c,var(--accent))}
.ibox h3{font-size:19px;font-weight:900;margin-bottom:6px}
.ibox p,.ibox li{font-size:15px;color:var(--muted)}
.ibox ul{margin:0;padding-left:1.1em}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font-family:var(--f-disp);font-size:22px;color:var(--accent)}
.faq details[open] summary::after{content:"−"}
.faq details p{color:var(--muted);margin-top:8px}

/* form */
.form{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.form label{display:grid;gap:4px;font-size:14px}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;font:inherit;color:inherit}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.banner{position:relative;border-radius:16px;overflow:hidden;color:#fff;min-height:360px;display:flex;align-items:flex-end}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,13,17,.8),rgba(6,13,17,.1))}
.banner .b{position:relative;z-index:1;padding:34px;max-width:36em;display:grid;gap:12px}
.banner h2{font-size:clamp(28px,3.6vw,44px);font-weight:900}
.banner p{color:#e2eaea}

.pager{display:flex;justify-content:space-between;gap:12px}
.pager a{text-decoration:none;display:flex;flex-direction:column;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);flex:1;min-width:0}
.pager a:last-child{text-align:right}
.pager small{color:var(--muted);font-size:12px}

.lb{position:fixed;inset:0;z-index:60;background:rgba(4,9,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:84vh;border-radius:8px}
.lb p{color:#dfe7ea;margin-top:10px;font-size:14px;text-align:center}
.lb button{position:absolute;top:14px;right:16px;background:#fff;color:#111;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}

footer{background:var(--night);color:#a9bcbf;padding-block:44px 54px;font-size:14px}
footer .wrap{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:28px}
footer b{color:#fff;display:block;margin-bottom:8px}
footer a{color:#dbe6e8;text-decoration:none;display:block;padding:2px 0}
footer small{display:block;margin-top:14px;font-size:12px;color:#7d9196}

@media (max-width:1000px){
  .stations,.allday{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.tickets,.planner,.hotels{grid-template-columns:1fr}
  .split.rev>.media{order:0}
  .tiles,.info{grid-template-columns:repeat(2,minmax(0,1fr))}
  .calc{position:static}
  .links{display:none}
  footer .wrap{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
  .stations,.allday,.tiles,.info{grid-template-columns:1fr}
  .strip{grid-template-columns:1fr 1fr}
  .route text{display:none}
  .scard{min-height:360px}
  .brand b{font-size:17px}
  .nav .cta{display:none}

function buildPlan(){
  const {len,who,like}=plan; let seq=[];
  const pick={food:['t1_st','t3_lunch'],lake:['t1_sky','t2_walk'],forest:['t4_trail','t4_deck'],resort:['t2_pool','t3_spa']}[like];
  const forestAct=who==='elder'?'t4_deck':(like==='forest'?'t4_trail':'t4_deck');
  if(len==='2h'){ seq=[['10:00','t1_sky'],['10:30','ride1'],['10:45',like==='forest'?'t4_deck':like==='food'?'t1_st':'t2_walk'],['11:40','back']]; if(like==='food') seq=[['10:00','ride1'],['10:15','t2_walk'],['11:00','back'],['11:15','t1_st']]; }
  else if(len==='half'){ seq=[['13:00','t1_st'],['14:00','ride1'],['14:15','t2_walk'],['15:00',who==='family'?'t3_xr':'t3_lunch'],['16:15',forestAct],['17:15','back'],['17:40','t1_mir']]; if(like==='forest') seq.splice(3,1); }
  else if(len==='day'){ seq=[['09:30','t1_sky'],['10:00','ride1'],['10:15','t2_walk'],['11:30',like==='forest'?'t4_trail':'t4_deck'],['13:00','t3_lunch'],['14:30',who==='family'?'t3_xr':like==='resort'?'t3_spa':'t4_ther'],['17:00','back'],['17:30','t1_st'],['19:00','t1_mir']]; if(who==='couple'||like==='lake') seq.splice(7,0,['18:00','night']); }
  else { const hotel=(who==='couple'||like==='lake'||like==='resort')?'t2_in':'t3_in';
    seq=[['14:00','t1_st'],['15:30','ride1'],['16:00',hotel],['17:00',hotel==='t2_in'?'t2_pool':(who==='family'?'t3_xr':'t3_spa')],['18:30','t3_din'],['20:30','night'],['05:40','dawn'],['07:30',forestAct],['10:00','t4_ther'],['12:00','back']]; }
  if(who==='family'&&!seq.some(s=>s[1]==='t3_xr')&&len!=='2h') seq.splice(Math.min(3,seq.length-1),0,['','t3_xr']);
  // 票價估算
  const reducedP=who==='elder'?'480 / 240':'480';
  const slot=seq.some(s=>s[1]==='night'||s[1]==='dawn')?(seq.filter(s=>s[1]==='night'||s[1]==='dawn').length*150):0;
  return {seq,cost:480+slot,slot,elder:who==='elder',room:len==='stay'?(seq.some(s=>s[1]==='t2_in')?'5,200':'4,300'):null};
}

/* ================= 票價試算 ================= */
function calcTotal(){
  const t=L(), tk=t.tk[calc.type];
  const pax=calc.adult+calc.reduced;
  let sum=calc.adult*tk[2]+calc.reduced*tk[3];
  t.adds.forEach(a=>{if(calc.adds[a[0]]){sum+= a[0]==='cabin'?a[3]*Math.max(1,Math.ceil((pax+calc.child)/6)) : a[0]==='photo'?a[3] : a[3]*pax;}});
  sum+=calc.park*50;
  return sum;
}
function calcBox(){
  const t=L();
  const stepper=(k,label,sub)=>`<div class="row"><label>${label}${sub?`<small>${sub}</small>`:''}</label><div class="step"><button type="button" data-step="${k}" data-d="-1" aria-label="−">−</button><output id="o_${k}">${calc[k]}</output><button type="button" data-step="${k}" data-d="1" aria-label="+">+</button></div></div>`;
  return `<div class="calc"><h3>${t.calcH}</h3>
   <div class="row"><label for="ctype">${t.calcType}</label><select id="ctype">${t.tk.map((x,i)=>`<option value="${i}"${i===calc.type?' selected':''}>${x[0]}</option>`).join('')}</select></div>
   ${stepper('adult',t.adult)}${stepper('reduced',t.reduced)}${stepper('child',t.child)}
   ${t.adds.map(a=>`<label class="chk"><input type="checkbox" data-add="${a[0]}"${calc.adds[a[0]]?' checked':''}> ${a[1]} <span class="num" style="margin-left:auto">+${fmt(a[3])}</span></label>`).join('')}
   ${stepper('park',t.calcPark)}
   <div class="total"><span>${t.calcTotal}</span><b>NT$ <span id="ctotal">${fmt(calcTotal())}</span></b></div>
   <button class="cta" type="button" id="copyCalc">${t.calcCopy}</button><div class="copied" id="calcMsg" aria-live="polite"></div></div>`;
}

  return pageHero('t1-street.jpg',t.eatH,t.eatP,t.nav[3][1])+
  `<section><div class="wrap"><div class="split"><div class="media">${img('t1-food.jpg',t.eatStory[0])}</div><div class="prose"><span class="kicker" style="color:var(--t1)">Xinhua Gate</span><h2>${t.eatStory[0]}</h2><p class="lead">${t.eatStory[1]}</p><a class="more" href="#t1" style="justify-self:start">${t.st.t1.n} →</a></div></div></div></section>
  <section><div class="wrap"><div class="tiles" style="--sc:var(--t1)">${t.eatTiles.map(x=>`<article class="tile">${img(x[2],x[0])}<div class="b"><span class="tag">T1</span><h3>${x[0]}</h3><p>${x[1]}</p></div></article>`).join('')}</div></div></section>`;
}
function events(){
  const t=L();
  return pageHero('t3-banquet.jpg',t.evH,t.evP,t.nav[4][1])+
  `<section><div class="wrap"><div class="tiles" style="grid-template-columns:repeat(2,minmax(0,1fr))">${t.ev.map((x,i)=>`<article class="tile">${img(x[2],x[0])}<div class="b"><span class="tag" style="color:var(--${i===0?'t2':'t3'})">${i===0?t.hotels[0].n:t.hotels[1].n}</span><h3>${x[0]}</h3><p>${x[1]}</p></div></article>`).join('')}</div></div></section>
  <section><div class="wrap"><div class="split"><div class="prose"><span class="kicker">Inquiry</span><h2>${t.formH}</h2><p>${t.evP}</p></div>
  <form class="form" id="evForm"><label for="fType">${t.fType}<select id="fType">${t.fTypes.map(x=>`<option>${x}</option>`).join('')}</select></label>
  <div class="two"><label for="fDate">${t.fDate}<input id="fDate" type="date"></label><label for="fPax">${t.fPax}<input id="fPax" type="number" min="1" value="80"></label></div>
  <label for="fName">${t.fName}<input id="fName" type="text"></label><label for="fNote">${t.fNote}<textarea id="fNote" rows="3"></textarea></label>
  <button class="cta ink" type="submit" style="justify-self:start">${t.fBtn}</button><div id="fOut"></div></form></div></div></section>`;
}
function planPage(){
  const t=L();
  return pageHero('t4-trail.jpg',t.plh,t.plp,t.nav[5][1])+`<section><div class="wrap">${planner()}</div></section>`;
}
function visit(){
  const t=L();
  return pageHero('aerial.jpg',t.visH,t.visP,t.nav[6][1])+
  `<section><div class="wrap"><div class="info" style="grid-template-columns:repeat(2,minmax(0,1fr))">${t.vis.map(v=>`<div class="ibox" style="--c:${v[2]}"><h3>${v[0]}</h3><p>${v[1]}</p></div>`).join('')}</div>
  <div class="ibox" style="margin-top:16px;--c:var(--gold)"><h3>${t.visOpen[0]}</h3><p>${t.visOpen[1]}</p></div></div></section>`;
}

/* ================= 路由與互動 ================= */
const ROUTES={home,ride,stations,stay,eat,events,plan:planPage,visit,t1:()=>station('t1'),t2:()=>station('t2'),t3:()=>station('t3'),t4:()=>station('t4')};
function render(keepScroll){
  const t=L(); let h=(location.hash||'#home').slice(1); if(!ROUTES[h]) h='home';
  document.documentElement.lang={zh:'zh-Hant',en:'en',ja:'ja'}[lang];
  $('#brandName').textContent=t.brand; $('#navCta').textContent=t.cta;
  $$('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  const cur=h.startsWith('t')&&h.length===2?'stations':h;
  $('#links').innerHTML=t.nav.map(n=>`<a href="#${n[0]}"${n[0]===cur?' aria-current="page"':''}>${n[1]}</a>`).join('');
  $('#app').innerHTML=ROUTES[h]();
  $('#foot').innerHTML=`<div><b>${t.foot.about}</b><p>${t.foot.aboutP}</p><small>${t.foot.small}</small></div><div><b>${t.foot.h1}</b>${ST_ORDER.map(id=>`<a href="#${id}">${t.st[id].n}</a>`).join('')}<a href="#stay">${t.nav[2][1]}</a><a href="#eat">${t.nav[3][1]}</a></div><div><b>${t.foot.h2}</b><a href="#ride">${t.cta}</a><a href="#plan">${t.nav[5][1]}</a><a href="#events">${t.nav[4][1]}</a><a href="#visit">${t.nav[6][1]}</a></div>`;
  document.title=h==='home'?t.brand:(t.nav.find(n=>n[0]===cur)?.[1]||t.st[h]?.n||'')+'｜'+t.brand;
  if(!keepScroll) window.scrollTo(0,0);
  setupJourney();
}
let jObs=null;
function setupJourney(){
  if(jObs){jObs.disconnect();jObs=null;}
  const box=$('#jtext'); if(!box) return;
  box.innerHTML=spanText(0);
  jObs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const i=+e.target.dataset.i;
    $$('.jimgs img').forEach((im,k)=>im.classList.toggle('on',k===i)); box.innerHTML=spanText(i);}})},{rootMargin:'-45% 0px -45% 0px'});
  $$('.jsteps .s').forEach(s=>jObs.observe(s));
  onScroll();
}
function onScroll(){
  const w=$('.jwrap'); if(!w) return;
  const r=w.getBoundingClientRect(), total=r.height-innerHeight;
  const f=Math.min(1,Math.max(0,-r.top/Math.max(1,total)));
  const p=$('#rprog'); if(p) p.setAttribute('stroke-dashoffset',String(100-f*100));
  const pl=$('#rprog'); const car=$('#rcar');
  if(pl&&car&&pl.getTotalLength){const L0=pl.getTotalLength(), pt=pl.getPointAtLength(L0*f); car.setAttribute('cx',pt.x); car.setAttribute('cy',pt.y);}
}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('hashchange',()=>render());
function copy(text,msgSel){
  const ok=()=>{const m=$(msgSel); if(m) m.textContent=L().copied;};
  try{navigator.clipboard.writeText(text).then(ok,()=>fallback());}catch(e){fallback();}
  function fallback(){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){}ta.remove();}
}
document.addEventListener('click',e=>{
  const lb=e.target.closest('#langs button'); if(lb){lang=lb.dataset.lang; try{localStorage.setItem('htp-lang',lang)}catch(_){} render(true); return;}
  const tb=e.target.closest('[data-time]'); if(tb){time=tb.dataset.time; const hero=$('.hero'); if(hero){hero.outerHTML=heroHome();} return;}
  const ob=e.target.closest('.opts button'); if(ob){plan[ob.parentElement.dataset.q]=ob.dataset.v; ob.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===ob)); $('#planOut').innerHTML=planOut(); return;}
  if(e.target.closest('#copyPlan')){const txt=[...$$('#planOut .tl li')].map(li=>li.querySelector('.t').textContent+'  '+li.querySelector('b').textContent+'｜'+li.querySelector('.x span').textContent).join('\n'); copy($('#planOut h3').textContent+'\n'+txt,'#planMsg'); return;}
  const sb=e.target.closest('[data-step]'); if(sb){const k=sb.dataset.step; calc[k]=Math.max(0,Math.min(40,calc[k]+(+sb.dataset.d))); $('#o_'+k).textContent=calc[k]; $('#ctotal').textContent=fmt(calcTotal()); return;}
  if(e.target.closest('#copyCalc')){const t=L(), tk=t.tk[calc.type]; const lines=[`${tk[0]}：${t.adult} ${calc.adult}、${t.reduced} ${calc.reduced}、${t.child} ${calc.child}`]; t.adds.forEach(a=>{if(calc.adds[a[0]])lines.push(a[1]);}); if(calc.park) lines.push(`${t.calcPark} × ${calc.park}`); lines.push(`${t.calcTotal} NT$ ${fmt(calcTotal())}`); copy(lines.join('\n'),'#calcMsg'); return;}
  const z=e.target.closest('img[data-zoom]'); if(z){$('#lbi').src=z.src;$('#lbi').alt=z.alt;$('#lbc').textContent=z.alt;$('#lb').hidden=false;return;}
  if(e.target.closest('#lb')) $('#lb').hidden=true;
});
document.addEventListener('change',e=>{
  if(e.target.id==='ctype'){calc.type=+e.target.value; $('#ctotal').textContent=fmt(calcTotal());}
  if(e.target.dataset.add){calc.adds[e.target.dataset.add]=e.target.checked; $('#ctotal').textContent=fmt(calcTotal());}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='evForm') return; e.preventDefault(); const t=L();
  const txt=`${t.fType}：${$('#fType').value}\n${t.fDate}：${$('#fDate').value||'—'}\n${t.fPax}：${$('#fPax').value}\n${t.fName}：${$('#fName').value||'—'}\n${t.fNote}：${$('#fNote').value||'—'}`;
  $('#fOut').innerHTML=`<p class="note">${t.fOut}</p><pre style="white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:12px;font:inherit;font-size:14px;margin:6px 0 0">${txt.replace(/</g,'&lt;')}</pre><button class="cta" type="button" id="copyForm" style="margin-top:8px">${t.copy}</button><div class="copied" id="formMsg"></div>`;
  $('#copyForm').onclick=()=>copy(txt,'#formMsg');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape') $('#lb').hidden=true;});
render();
</script>
</body>
</html>
